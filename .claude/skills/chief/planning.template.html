<!DOCTYPE html>
<!-- Template for /chief. render.py fills the {{TOKENS}}; do not fill in by hand. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This week</title><style>
:root{--ink:#22262b;--ink2:#555c64;--mute:#9aa0a7;--line:#eef0f2;--accent:#1f4886;--red:#c0392b;--bg:#f1f0ec}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-size:14px;line-height:1.5;padding:48px 16px}
.page{max-width:680px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.07)}

/* header with landscape */
.hero{position:relative;height:190px;color:#fff}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:absolute;left:40px;bottom:26px;right:40px}
.hero h1{font-size:28px;font-weight:600;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(20,40,70,.25)}
.hero .sub{font-size:13.5px;opacity:.92;margin-top:2px}
.quote{position:absolute;top:22px;left:40px;font-size:12.5px;font-style:italic;opacity:.92;max-width:60%}

.body{padding:30px 40px 34px}
h2{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
section{margin-bottom:30px}

/* deadlines */
.dl{list-style:none}
.dl li{display:flex;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.dl li:first-child{border-top:0}
.dl li:hover .t{color:var(--accent)}
.pill{flex:none;min-width:70px;text-align:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;
  background:#eef2f8;color:var(--accent);font-variant-numeric:tabular-nums}
.pill.late{background:#fbecea;color:var(--red)}
.pill.now{background:#fdf1e2;color:#b86b12}
.t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p{flex:none;font-size:11.5px;color:var(--mute);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{color:var(--mute)}

/* reminders */
.rem{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rem div{display:flex;gap:10px;align-items:baseline;background:#f7f8f6;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink2)}
.rem b{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6e9e8a;min-width:70px}

/* projects */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;border-top:3px solid var(--c);cursor:pointer;
  transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:4px}
.card p{font-size:13px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .f{margin-top:10px;font-size:11.5px;color:var(--mute)}
.card .f .late{color:var(--red);font-weight:600}

/* corrections */
.fix{border-top:1px solid var(--line);padding-top:22px}
textarea{width:100%;min-height:60px;resize:vertical;border:1px solid #e2e5e8;border-radius:10px;padding:10px 12px;
  font:inherit;font-size:13.5px;color:var(--ink);background:#fafafa;outline:none}
textarea:focus{border-color:var(--accent);background:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.bar span{font-size:12px;color:var(--mute)}
button{border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-size:13px;padding:7px 16px;cursor:pointer}
@media (max-width:640px){body{padding:16px}.body{padding:24px 20px}.hero .txt,.quote{left:20px}.grid,.rem{grid-template-columns:1fr}.p{display:none}}
</style></head><body><div class="page">

<header class="hero">
  <svg viewBox="0 0 680 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7d9cc4"/><stop offset=".65" stop-color="#c7d3df"/><stop offset="1" stop-color="#ead9c2"/>
      </linearGradient>
    </defs>
    <rect width="680" height="190" fill="url(#sky)"/>
    <circle cx="530" cy="112" r="56" fill="#f6e3c4" opacity=".2"/>
    <circle cx="530" cy="112" r="38" fill="#f6e3c4" opacity=".95"/>
    <path d="M0 130 C90 100 160 112 240 104 C330 95 400 120 480 112 C560 104 620 90 680 98 V190 H0Z" fill="#9db0c6" opacity=".9"/>
    <path d="M0 150 C80 132 170 148 260 138 C360 127 430 150 520 144 C590 139 640 130 680 134 V190 H0Z" fill="#6f88a8"/>
    <path d="M0 172 C110 158 210 172 320 164 C420 157 520 176 680 162 V190 H0Z" fill="#3f5f88"/>
    <path d="M380 62 q6 -5 12 0 q6 -5 12 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
    <path d="M418 48 q4 -3.5 8 0 q4 -3.5 8 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  </svg>
  <p class="quote">{{QUOTE}}</p>
  <div class="txt"><h1>This week</h1><p class="sub">{{DATE}}{{FOCUS}}</p></div>
</header>

<div class="body">

{{DEADLINES}}

{{REMINDERS}}

<section><h2>Per project</h2><div class="grid">{{PROJECTS}}</div></section>

<div class="fix">
  <h2>Something off?</h2>
  <textarea id="fix" placeholder="E.g. 'Recruiter call already happened', or click a deadline or project"></textarea>
  <div class="bar"><span id="msg">Goes to the next /chief.</span><button id="send">Save</button></div>
</div>

</div></div>
<script>
const fix = document.getElementById('fix'), msg = document.getElementById('msg');
document.querySelectorAll('[data-task]').forEach(el => el.onclick = () => {
  fix.value += (fix.value && !fix.value.endsWith('\n') ? '\n' : '') + el.dataset.task + ': ';
  fix.focus();
});
document.getElementById('send').onclick = async () => {
  const text = fix.value.trim();
  if (!text) return;
  try {
    const r = await fetch('/correction', {method: 'POST', body: text});
    if (!r.ok) throw 0;
    fix.value = ''; msg.textContent = 'Saved. The next /chief applies it.';
  } catch (e) {
    await navigator.clipboard.writeText(text);
    msg.textContent = 'Saving failed; copied to clipboard, paste it into Claude.';
  }
};
</script>
</body></html>
